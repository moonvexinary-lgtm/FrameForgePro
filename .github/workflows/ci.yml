# FrameForge Pro CI — all compilation and testing is cloud-only (windows-2025).
# Storage policy: report disk space before and after, no target-dir caching,
# incremental compilation off.
# Diagnostics: a problem matcher turns rustc/clippy/cargo error lines into
# check-run annotations, and on failure every cargo log is pushed to the
# `ci-diagnostics` branch so failures are readable without log access.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

permissions:
  contents: write

jobs:
  windows:
    name: fmt / clippy / check / test / build
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disk space (before)
        run: Get-PSDrive C | Select-Object Name, Used, Free | Format-Table

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Toolchain
        run: rustc --version; cargo --version

      - name: Register rust problem matcher
        run: |
          $matcher = @{
            problemMatcher = @(
              @{
                owner = "rust"
                pattern = @(
                  @{ regexp = '^error(?:\[[E]\d+\])?: (.+)$'; message = 1 }
                  @{ regexp = '^\s*-->\s*([^:]+):(\d+):(\d+)$'; file = 1; line = 2; column = 3 }
                )
              }
            )
          }
          $json = ConvertTo-Json -InputObject $matcher -Depth 10
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP/rust-matcher.json", $json)
          Write-Host "::add-matcher::$env:RUNNER_TEMP/rust-matcher.json"

      - name: Formatting (rustfmt --check)
        if: always()
        run: |
          cargo fmt --all --check 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/fmt.log"
          exit $LASTEXITCODE

      - name: Lint (clippy -D warnings)
        if: always()
        run: |
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/clippy.log"
          exit $LASTEXITCODE

      - name: Type-check (cargo check)
        if: always()
        run: |
          cargo check --workspace --all-targets 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/check.log"
          exit $LASTEXITCODE

      - name: Tests (cargo test)
        if: always()
        run: |
          cargo test --workspace -- --show-output 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/test.log"
          exit $LASTEXITCODE

      - name: Release build (frameforge-pro)
        if: always()
        run: |
          cargo build --release -p frameforge-pro 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/build.log"
          exit $LASTEXITCODE

      - name: Binary self-test
        if: always()
        run: |
          ./target/release/frameforge-pro.exe selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/frameforge-pro.exe roto-bench 4

      - name: Upload Windows development build
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/frameforge-rust-rewrite'
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-pro-windows-dev
          path: target/release/frameforge-pro.exe
          retention-days: 7
          if-no-files-found: error

      - name: Disk space (after)
        if: always()
        run: Get-PSDrive C | Select-Object Name, Used, Free | Format-Table

      - name: Publish diagnostics to the ci-diagnostics branch (on failure)
        if: failure()
        run: |
          $dir = "ci-diagnostics/$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($f in "fmt.log", "clippy.log", "check.log", "test.log", "build.log") {
            $p = Join-Path $env:RUNNER_TEMP $f
            if (Test-Path $p) { Copy-Item $p (Join-Path $dir $f) }
          }
          if ((Get-ChildItem $dir -File -ErrorAction SilentlyContinue | Measure-Object).Count -eq 0) {
            Write-Host "no logs to publish"
            exit 0
          }
          git config user.name "frameforge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add ci-diagnostics
          git commit -q -m "CI diagnostics for run $env:GITHUB_RUN_ID"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/ci-diagnostics"

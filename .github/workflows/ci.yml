# FrameForge Pro CI — all compilation and testing is cloud-only (windows-2025).
# Storage policy: report disk space before and after, no target-dir caching,
# incremental compilation off, small workspace so no job splitting is needed yet.
# A problem matcher turns rustc/clippy/cargo error lines into check-run
# annotations, so the exact failing lines are visible without log access.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  windows:
    name: fmt / clippy / check / test / build
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disk space (before)
        run: Get-PSDrive C | Select-Object Name, Used, Free | Format-Table

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Toolchain
        run: rustc --version; cargo --version

      - name: Register rust problem matcher (diagnostic only; never fails)
        run: |
          try {
            $json = @'
            {
              "problemMatcher": [
                {
                  "owner": "rust",
                  "pattern": [
                    {
                      "regexp": "^error(?:\\[E\\d+\\])?: (.+)$",
                      "message": 1
                    },
                    {
                      "regexp": "^\\s*-->\\s*([^:]+):(\\d+):(\\d+)$",
                      "file": 1,
                      "line": 2,
                      "column": 3
                    }
                  ]
                }
              ]
            }
            '@
            [System.IO.File]::WriteAllText("$env:RUNNER_TEMP/rust-matcher.json", $json)
            Write-Host "::add-matcher::$env:RUNNER_TEMP/rust-matcher.json"
          } catch {
            Write-Host "problem matcher registration failed (continuing without it)"
          }

      - name: Formatting (rustfmt --check)
        run: cargo fmt --all --check

      - name: Lint (clippy -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Type-check (cargo check)
        if: always()
        run: cargo check --workspace --all-targets

      - name: Tests (cargo test)
        if: always()
        run: cargo test --workspace

      - name: Release build (frameforge-pro)
        if: always()
        run: cargo build --release -p frameforge-pro

      - name: Binary self-test
        if: always()
        run: ./target/release/frameforge-pro.exe

      - name: Disk space (after)
        if: always()
        run: Get-PSDrive C | Select-Object Name, Used, Free | Format-Table

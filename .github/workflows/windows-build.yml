# FrameForge Pro — remote Windows build & test (GitHub Actions)
#
# Verified against the actual CraftMaster/Craft sources (KDE GitHub mirrors):
#   - CraftMaster.py CLI: --config <ini> --prefix does NOT exist; the root
#     comes from [Variables] Root in the settings file. Commands follow -c.
#   - invent.kde.org returns 403 to GitHub runner IPs, so craft, craftmaster
#     and craft-blueprints-kde are all cloned from KDE's GitHub mirrors.
#   - The KDE blueprints repo is normally fetched by the
#     craft/craft-blueprints-kde package from invent.kde.org; its source
#     explicitly checks for a pre-existing "legacy" checkout at
#     <craftRoot>/etc/blueprints/craft-kde and uses that instead — so we
#     pre-clone the GitHub mirror there (BlueprintVersions/EnableDailyUpdates
#     is disabled so nothing re-fetches from KDE GitLab).
#   - ABI format (from craft's CraftSettings.ini.template):
#     windows-cl-msvc2022-x86_64.

name: Windows Build & Test

on:
  push:
    branches: [frameforge-dev, master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 350
    env:
      CRAFT_MASTER: ${{ github.workspace }}\craftmaster
      CRAFT_ROOT: ${{ github.workspace }}\craft
      CRAFT_SETTINGS: ${{ github.workspace }}\craft-settings.ini
      CRAFT_TARGET: windows-msvc2022_64-cl
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install VS2022 Build Tools (for msvc2022 cache packages)
        shell: pwsh
        run: |
          # The runner has VS2026 only; craft needs msvc2022 for the
          # prebuilt binary cache from files.kde.org
          $vsInstaller = "${env:TEMP}\vs_installer.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_BuildTools.exe" -OutFile $vsInstaller
          Start-Process -FilePath $vsInstaller -ArgumentList @(
            "--quiet", "--wait", "--norestart", "--nocache",
            "--installPath", "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools",
            "--add", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
            "--add", "Microsoft.VisualStudio.Component.Windows11SDK.22621"
          ) -Wait
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products "*" -version "[17,18)" -property installationPath

      - name: Set up Python (Craft)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Craft workspace
        uses: actions/cache@v4
        with:
          path: |
            craft/install
          key: craft-install-win-msvc2022-${{ hashFiles('.craft.ini') }}
          restore-keys: |
            craft-install-win-msvc2022-

      - name: Bootstrap CraftMaster, Craft and the KDE blueprints
        shell: pwsh
        run: |
          # 1. CraftMaster from KDE's GitHub mirror (invent.kde.org 403s runner IPs)
          git clone --depth 1 https://github.com/KDE/craftmaster.git "$env:CRAFT_MASTER"
          # 2. Settings for CraftMaster (schema verified against CraftMaster.py/Config.py)
          @'
          [General]
          Branch = master
          ShallowClone = True
          CraftUrl = https://github.com/KDE/craft.git

          [Variables]
          Root = ${{ github.workspace }}\craft

          [GeneralSettings]
          Paths/Python = ${{ env.pythonLocation }}
          Compile/Jobs = 8
          Compile/UseNinja = True
          BlueprintVersions/EnableDailyUpdates = False
          Packager/UseCache = True
          ContinuousIntegration/Enabled = True
          ContinuousIntegration/ClearBuildFolder = True
          Blueprints/Locations = ${{ github.workspace }}\craft\kde-blueprints
          Portage/Ignores = libs/frei0r-plugins;libs/frei0r-bigsh0t

          [windows-msvc2022_64-cl]
          General/ABI = windows-cl-msvc2022-x86_64

          [windows-msvc2022_64-cl-BlueprintSettings]
          kde/kdemultimedia/kdenlive.version = master
          libs/frei0r-plugins.cmakeArgs = -DBUILD_TESTING=OFF
          '@ -replace '\$\{\{ github\.workspace \}\}', '$env:GITHUB_WORKSPACE' -replace '\$\{\{ env\.pythonLocation \}\}', '$env:pythonLocation' | Set-Content -Path "$env:CRAFT_SETTINGS" -Encoding UTF8
          # 3. Pre-clone the KDE blueprints and register them as a
          #    blueprint location via Blueprints/Locations.
          $bpDir = "$env:CRAFT_ROOT\kde-blueprints"
          if (-not (Test-Path $bpDir)) {
            git clone --depth 1 https://github.com/KDE/craft-blueprints-kde.git "$bpDir"
          }
          # Patch: disable frei0r test compilation on MSVC (the test files
          # use POSIX headers unistd.h/libgen.h that don't exist on MSVC).
          # Simple line insertion after the WITHOUT_CAIRO line.
          $frei0rPy = "$bpDir\libs\frei0r-plugins\frei0r-plugins.py"
          if ((Test-Path $frei0rPy) -and -not (Select-String -Path $frei0rPy -Pattern 'BUILD_TESTING' -Quiet)) {
            $lines = Get-Content $frei0rPy
            $newLines = @()
            foreach ($line in $lines) {
              $newLines += $line
              if ($line -match 'WITHOUT_CAIRO') {
                $newLines += '            "-DBUILD_TESTING=OFF",'
              }
            }
            $newLines | Set-Content -Path $frei0rPy -Encoding UTF8
            "Patched frei0r blueprint: BUILD_TESTING=OFF added"
          }
          Get-Content "$env:CRAFT_SETTINGS"
          # 4. Pre-clone MLT (the recursive git clone fails on the runner;
          #    cloning without submodules to the expected path so craft
          #    finds it already there and skips its own clone).
          $mltDir = "$env:CRAFT_ROOT\download\git\libs\mlt"
          if (-not (Test-Path $mltDir)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $mltDir) | Out-Null
            git clone --depth 1 https://github.com/mltframework/mlt.git "$mltDir"
            "MLT pre-cloned (no submodules)"
          }

      - name: Install dependencies (craft kdenlive dependency chain)
        shell: pwsh
        run: |
          # --install-deps builds the whole chain (Qt6, KF6, MLT7, OTIO,
          # Imath, KDDockWidgets). First run ~1-2 h; later runs restore
          # from the Actions cache. The KDE binary cache
          # (files.kde.org/craft) may pre-empt source builds where usable.
          python "$env:CRAFT_MASTER\CraftMaster.py" --config "$env:CRAFT_SETTINGS" -c --install-deps kde/kdemultimedia/kdenlive

      - name: Configure, build and test the FrameForge checkout
        shell: pwsh
        run: |
          # Activate the Craft environment (PATH, CMAKE_PREFIX_PATH, ...)
          & "$env:CRAFT_ROOT\$env:CRAFT_TARGET\craft\craftenv.ps1"
          $prefix = "$env:CRAFT_ROOT\$env:CRAFT_TARGET\install"
          cmake -S "$env:GITHUB_WORKSPACE" -B "$env:GITHUB_WORKSPACE\build-frameforge" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DBUILD_TESTING=ON `
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build "$env:GITHUB_WORKSPACE\build-frameforge" --config RelWithDebInfo --parallel
          ctest --test-dir "$env:GITHUB_WORKSPACE\build-frameforge" -C RelWithDebInfo --output-on-failure

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build-frameforge/Testing/
          retention-days: 14

      - name: Upload built application
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-windows-bin
          path: |
            build-frameforge/bin/
            build-frameforge/*.exe
          retention-days: 30
          if-no-files-found: warn

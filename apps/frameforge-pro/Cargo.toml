[package]
name = "frameforge-pro"
description = "FrameForge Pro — a unified Rust video editor: FilmCraft nonlinear editing + EffectCraft compositing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
frameforge-core = { workspace = true }
frameforge-bridge = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-codecs = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
image = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# The shell layer is allowed the loud failure modes the engine crates forbid
# (upstream's own pattern: the app installs a panic hook and keeps the session
# alive; that hook lands with the engine session in M6/M7). No unsafe, ever.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
